name: Publish to crates.io

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # Gate: fmt + clippy + tests must pass before anything is published.
  quality:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      # Required for crates.io Trusted Publishing (OIDC), no API token needed
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Check if version already published
        id: check
        working-directory: rust
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="strhide") | .version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # A tag release must match the version in Cargo.toml: publishing v1.2.3
          # with the 0.9.3 manifest would either ship the wrong crate or hit the
          # "already published" skip below with no visible failure.
          if [[ "$GITHUB_REF_TYPE" == "tag" && "v$VERSION" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match rust/Cargo.toml version $VERSION"
            exit 1
          fi
          if curl -sf "https://crates.io/api/v1/crates/strhide" | jq -e --arg v "$VERSION" '.versions[]?.num == $v' > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::warning::strhide@$VERSION already exists on crates.io, skipping publish (bump version in rust/Cargo.toml to release)"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish crate
        if: steps.check.outputs.exists != 'true'
        working-directory: rust
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
