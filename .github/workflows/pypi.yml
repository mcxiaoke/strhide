name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build package
        # Package source lives in the python/ subdirectory
        run: python -m build python/ --outdir dist

      - name: Check metadata
        run: python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Required for Trusted Publishing (OIDC), no API token needed
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Check if version already published
        id: check
        run: |
          VERSION=$(ls dist/ | grep -oP '(?<=^strhide-)[^-]+' | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if curl -sf "https://pypi.org/pypi/strhide/json" | jq -e --arg v "$VERSION" '.releases | has($v)' > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::warning::strhide@$VERSION already exists on PyPI, skipping publish (bump python/strhide/__init__.py __version__ to release)"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to PyPI
        if: steps.check.outputs.exists != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
