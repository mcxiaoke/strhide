name: CI

# Quality gate shared by pull requests, branch pushes, and the two release
# workflows (which call it through `workflow_call`). Before this existed a tag
# push went straight to `cargo publish` / `cargo build --release`, so a
# regression could ship without ever being compiled by the test suite.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # `--all-targets` compiles the integration tests but does not run the
      # #[ignore]d corpus sweep (`batch_corpus`), which needs external files.
      - name: Test
        run: cargo test --release --locked --all-targets

      # Stage 0 of `docs/strhide_architecture_and_refactoring_plan.md` tracks
      # the "one domain at a time" build. It is deliberately non-blocking for
      # now: both builds compile, but the `engine`-only build still emits
      # dead-code/unused-import warnings (`MAX_CONTENT_STEGO_BYTES`,
      # `OsString`, `PathBuf`) that stage 1 removes together with the
      # `structure-base` / `content-*` feature split. Flip this to blocking
      # once stage 1 lands.
      - name: Minimal feature builds (stage 0, non-blocking)
        continue-on-error: true
        run: |
          cargo build --no-default-features --features engine
          cargo build --no-default-features --features stego
