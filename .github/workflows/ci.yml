name: CI

# Quality gate shared by pull requests, branch pushes, and the two release
# workflows (which call it through `workflow_call`). Before this existed a tag
# push went straight to `cargo publish` / `cargo build --release`, so a
# regression could ship without ever being compiled by the test suite.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Architectural boundary check
        run: python ../scripts/import_lint.py

      # `--all-targets` compiles the integration tests but does not run the
      # #[ignore]d corpus sweep (`batch_corpus`), which needs external files.
      # `--all-features` is what covers the CLI: the library default set
      # deliberately excludes clap/toml/rpassword, and `tests/test_cli.rs` is
      # gated on the `cli` feature.
      - name: Test
        run: cargo test --release --locked --all-features --all-targets

      # docs.rs is the crate's front page. A broken intra-doc link or a
      # private-item reference is invisible to `cargo test`, so gate it here.
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --all-features --no-deps

      # Doctests are the only executable form of the documented API examples,
      # and `--all-targets` does not run them.
      - name: Doc tests
        run: cargo test --release --locked --all-features --doc

      # The two domains must compile without each other (stage 1 of
      # docs/strhide_architecture_and_refactoring_plan.md). Blocking since
      # stage 1 landed; fine-grained builds ensure light-weight GUIs can compile
      # trimmed feature combinations. The row list lives in the script so local
      # runs and CI cannot drift apart.
      - name: Minimal feature builds
        run: python ../scripts/check_feature_matrix.py
