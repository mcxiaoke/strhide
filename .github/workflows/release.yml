name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Gate: fmt + clippy + tests must pass before any binary is built.
  quality:
    uses: ./.github/workflows/ci.yml

  windows:
    name: windows (${{ matrix.arch }})
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rustflags: ""
            out: strhide-windows-x86_64.exe
          - arch: x86_64-avx2
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rustflags: "-C target-cpu=x86-64-v3"
            out: strhide-windows-x86_64-avx2.exe
          - arch: aarch64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            rustflags: ""
            out: strhide-windows-aarch64.exe
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        working-directory: rust
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "rust/target/${{ matrix.target }}/release/strhide.exe" "dist/${{ matrix.out }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: dist/${{ matrix.out }}
          if-no-files-found: error

  linux:
    name: linux (${{ matrix.arch }}, static musl)
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            rustflags: ""
            out: strhide-linux-x86_64
          - arch: x86_64-avx2
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            rustflags: "-C target-cpu=x86-64-v3"
            out: strhide-linux-x86_64-avx2
          - arch: aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            rustflags: ""
            out: strhide-linux-aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # musl targets link statically by default; musl-tools provides the
      # corresponding musl-gcc wrapper on both native runners.
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        working-directory: rust
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Verify static linking
        run: |
          file "rust/target/${{ matrix.target }}/release/strhide"
          if ldd "rust/target/${{ matrix.target }}/release/strhide" 2>&1 | grep -q "not a dynamic executable"; then
            echo "OK: fully static"
          else
            echo "WARNING: binary is dynamically linked"
            ldd "rust/target/${{ matrix.target }}/release/strhide" || true
          fi

      - name: Stage artifact
        run: |
          mkdir -p dist
          cp "rust/target/${{ matrix.target }}/release/strhide" "dist/${{ matrix.out }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: dist/${{ matrix.out }}
          if-no-files-found: error

  macos:
    name: macos (universal2)
    needs: quality
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build both architectures
        working-directory: rust
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      - name: Create universal binary
        run: |
          mkdir -p dist
          lipo -create \
            rust/target/aarch64-apple-darwin/release/strhide \
            rust/target/x86_64-apple-darwin/release/strhide \
            -output dist/strhide-macos-universal2
          chmod +x dist/strhide-macos-universal2

      - uses: actions/upload-artifact@v4
        with:
          name: strhide-macos-universal2
          path: dist/strhide-macos-universal2
          if-no-files-found: error

  release:
    name: publish GitHub release
    needs: [windows, linux, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%f\n' \
            | sort | xargs sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
