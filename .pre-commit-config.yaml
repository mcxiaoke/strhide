repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        entry: pwsh -c "cd rust && cargo fmt --all -- --check"
        language: system
        pass_filenames: false
        types: [rust]

      - id: cargo-clippy
        name: cargo clippy -D warnings
        entry: pwsh -c "cd rust && cargo clippy --all-targets -- -D warnings"
        language: system
        pass_filenames: false
        types: [rust]
