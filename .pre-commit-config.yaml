repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        entry: pwsh -c "cd rust && cargo fmt --all -- --check"
        language: system
        pass_filenames: false
        types: [rust]

      - id: cargo-clippy
        name: cargo clippy -D warnings
        entry: pwsh -c "cd rust && cargo clippy --all-targets --all-features -- -D warnings"
        language: system
        pass_filenames: false
        types: [rust]

      # A feature-gate mismatch (a gated type definition with an ungated `impl`)
      # only shows up in the trimmed builds, which neither the default nor the
      # `--all-features` pass exercises. Cheap enough once the target dir is
      # warm; run it by hand when editing `cfg` attributes.
      - id: check-feature-matrix
        name: feature matrix (no-default + single-feature builds)
        entry: pwsh -c "python scripts/check_feature_matrix.py"
        language: system
        pass_filenames: false
        types: [rust]
