[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "strhide"
version = "0.1.0"
description = "Smart format-preserving lossless data hiding CLI tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=41.0.0",
]

[project.scripts]
strhide = "strhide.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
