[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "strhide"
dynamic = ["version"]
description = "Smart format-preserving lossless data hiding library and CLI (PNG/JPEG/MP4/ZIP/PDF/PE carriers, AES-256-GCM, stealth mode)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "mcxiaoke", email = "mcxiaoke@live.com" },
]
keywords = [
    "steganography",
    "data-hiding",
    "information-security",
    "stego",
    "lossless",
    "format-preserving",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
    "Topic :: Multimedia",
]
dependencies = [
    "cryptography>=41.0.0",
]

[project.urls]
Homepage = "https://github.com/mcxiaoke/strhide"
Documentation = "https://github.com/mcxiaoke/strhide#readme"
Changelog = "https://github.com/mcxiaoke/strhide/blob/main/docs"

[project.scripts]
strhide = "strhide.cli:main"

[tool.setuptools]
packages = ["strhide", "strhide.core", "strhide.adapters"]

[tool.setuptools.package-data]
strhide = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "strhide.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
