[package]
name = "strhide"
version = "0.1.0"
edition = "2024"

[lib]
name = "strhide"
path = "src/lib.rs"

[[bin]]
name = "strhide"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.11.1"
base64 = "0.23.1"
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
crc32fast = "1.5.2"
filetime = "0.2.29"
flate2 = "1.1.10"
hkdf = "0.13.0"
hmac = "0.13.0"
pbkdf2 = "0.13.0"
rand = "0.10.3"
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
toml = "0.9"
unicode-normalization = "0.1.25"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

