[package]
name = "strhide"
version = "0.8.1"
edition = "2024"
build = "build.rs"
description = "Smart format-preserving lossless data hiding library and CLI (PNG/JPEG/MP4/ZIP/PDF/PE carriers, AES-256-GCM, stealth mode)"
license = "Apache-2.0"
authors = ["mcxiaoke <mcxiaoke@live.com>"]
repository = "https://github.com/mcxiaoke/strhide"
homepage = "https://github.com/mcxiaoke/strhide"
documentation = "https://docs.rs/strhide"
readme = "README.md"
keywords = ["steganography", "stego", "data-hiding", "security", "lossless"]
categories = ["cryptography", "multimedia", "command-line-utilities"]
exclude = ["tests/"]

[features]
# Library defaults: both domains plus steganalysis, but not the CLI. `cargo add
# strhide` must not drag in clap/rpassword/toml. `analysis` stays in the default
# set because it is a headline capability (and its only extra dependency is
# `jpeg-decoder`); the CLI is the heavy switch.
default = ["structure", "content", "analysis"]

# Foundation shared by both domains (atomic commit, timestamp preservation).
core-io = ["dep:filetime"]

# Structure domain:
# - structure-base: container hiding for PNG, JPEG, MP4, ZIP, PDF, and PE slack/overlay
#   (zero disassembly dependency; compiles without iced-x86).
# - structure-pe: adds x86/x64 instruction substitution (`pe_codebits`) via iced-x86.
# - structure: meta-feature enabling the full structure domain.
structure-base = ["core-io", "dep:serde_json"]
structure-pe   = ["structure-base", "dep:iced-x86"]
structure      = ["structure-base", "structure-pe"]

# Content domain:
# - content-base: shared foundation (rayon, cost-model traits, generic STC coding).
# - content-png: spatial-domain PNG steganography (HILL, S-UNIWARD).
# - content-jpeg: DCT-domain JPEG steganography (UERD, ternary STC).
# - content-hevc: H.265/HEVC CABAC steganography (Annex-B and MP4/MOV bitstreams).
# - content-heif-bridge: HEIF/HEIC container and thumbnail transcoding bridge (pulls in PNG + JPEG).
# - content: meta-feature enabling all content engines.
content-base        = ["core-io", "dep:rayon"]
content-png         = ["content-base"]
content-jpeg        = ["content-base", "dep:dct-io"]
content-hevc        = ["content-base", "dep:oxideav-h265", "dep:rusty_h265"]
content-heif-bridge = ["content-hevc", "content-png", "content-jpeg"]
content             = ["content-png", "content-jpeg", "content-hevc", "content-heif-bridge"]

# Black-box steganalysis. Needs the structure domain (it recognises UBE
# envelopes and reads PE code) and the DCT reader (JPEG calibration); it does
# not need the content domain's embedding engines.
analysis = ["structure", "dep:jpeg-decoder", "dep:dct-io"]

# TOML settings model (`strhide.toml`, `~/.strhide/config.toml`).
config = ["dep:toml"]

# Command line.
cli = ["structure", "content", "analysis", "config", "dep:clap", "dep:rpassword", "dep:base64"]

[lib]
name = "strhide"
path = "src/lib.rs"

[[bin]]
name = "strhide"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "sth"
path = "src/lite.rs"
required-features = ["cli"]

# Domain-specific entry points. Thin `main`s in src/bin/ share the same lib
# crate (and therefore the same cli module) with `strhide`; each exposes only
# its own command group. All require the `cli` feature, so the minimal-feature
# builds used in CI still compile just the library.
[[bin]]
name = "sthc"
path = "src/bin/sthc.rs"
required-features = ["cli"]

[[bin]]
name = "sths"
path = "src/bin/sths.rs"
required-features = ["cli"]

[[bin]]
name = "sthv"
path = "src/bin/sthv.rs"
required-features = ["cli"]

[dependencies]
aes-gcm = "0.11.1"
crc32fast = "1.5.2"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
hkdf = "0.13.0"
hmac = "0.13.0"
oxideav-h265 = { git = "https://github.com/mcxiaoke/oxideav-h265.git", tag = "v1-20261024", optional = true }
pbkdf2 = "0.13.0"
rand = "0.10.3"
rusty_h265 = { git = "https://github.com/mcxiaoke/rusty_h265.git", tag = "v1-20261029", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
unicode-normalization = "0.1.25"

base64 = { version = "0.23.1", optional = true }
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"], optional = true }
dct-io = { version = "0.1", optional = true }
filetime = { version = "0.2.29", optional = true }
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "encoder"], optional = true }
jpeg-decoder = { version = "0.3.2", optional = true }
rpassword = { version = "7.5.4", optional = true }
rayon = { version = "1.10", optional = true }
serde_json = { version = "1.0.154", optional = true }
toml = { version = "0.9", optional = true }

[dev-dependencies]
rayon = "1.10"

[profile.test]
opt-level = 2
debug = 1
codegen-units = 12

# iced-x86 1.21.0 computes the instruction length as
#     let instr_len = self.data_ptr as u32 - data_ptr as u32;
# (src/decoder.rs::decode), i.e. it truncates both pointers to 32 bits and
# relies on that subtraction wrapping. When the decoded buffer straddles a
# 4 GiB virtual-address boundary the low-32-bit difference goes negative, so a
# build with overflow checks panics with "attempt to subtract with overflow" --
# release builds are unaffected (modular arithmetic yields the correct length).
#
# `pe_codebits::profile` hands iced a freshly heap-allocated `.text` copy, so
# whether a given run hits the boundary depends on the allocator's address:
# reproducible failure rate `len / 4 GiB` per decode, i.e. a rare, flaky panic
# in the PE corpus sweep. Upstream has no release with this fixed, so the
# wrapping semantics its code assumes are declared here for every profile that
# enables overflow checks.
[profile.dev.package."iced-x86"]
overflow-checks = false

[profile.test.package."iced-x86"]
overflow-checks = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
