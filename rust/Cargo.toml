[package]
name = "strhide"
version = "0.3.0"
edition = "2024"
description = "Smart format-preserving lossless data hiding library and CLI (PNG/JPEG/MP4/ZIP/PDF/PE carriers, AES-256-GCM, stealth mode)"
license = "Apache-2.0"
authors = ["mcxiaoke <mcxiaoke@live.com>"]
repository = "https://github.com/mcxiaoke/strhide"
homepage = "https://github.com/mcxiaoke/strhide"
documentation = "https://docs.rs/strhide"
readme = "README.md"
keywords = ["steganography", "stego", "data-hiding", "security", "lossless"]
categories = ["cryptography", "multimedia", "command-line-utilities"]
exclude = ["tests/"]

[lib]
name = "strhide"
path = "src/lib.rs"

[[bin]]
name = "strhide"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.11.1"
base64 = "0.23.1"
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
crc32fast = "1.5.2"
dct-io = "0.1"
filetime = "0.2.29"
flate2 = "1.1.10"
hkdf = "0.13.0"
hmac = "0.13.0"
# pe_codebits 策略：x86/x64 指令编解码（与 Python 侧 PyPI iced-x86 1.21 同源代码生成，
# 保证跨语言位信道一致）。仅需 decoder/encoder，关闭格式化器等重代码。
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "encoder"] }
jpeg-decoder = "0.3.2"
pbkdf2 = "0.13.0"
rand = "0.10.3"
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
toml = "0.9"
unicode-normalization = "0.1.25"

[dev-dependencies]
rayon = "1.10"

[profile.test]
opt-level = 2           # 保证加密和 stego 计算足够快
debug = 1              # 减少调试符号大小
codegen-units = 12     # 并行 codegen，大幅加快测试编译和链接

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
